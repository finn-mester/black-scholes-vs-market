[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "black-scholes-vs-market"
version = "0.1.0"
description = "Black-Scholes pricing, Greeks, Monte Carlo and implied volatility, tested against market data."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
